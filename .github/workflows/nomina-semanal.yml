# Foto semanal de la nómina de SILpy para el historial de bancadas (pipeline/bancadas.py).
# Requiere el secreto CONGRESOPY_CONTACTO (contacto del User-Agent). Hace 2 requests a SILpy por corrida.
# Commitea las fotos parseadas (silver/nomina/), el historial y los datos del sitio regenerados.
name: nomina-semanal

on:
  schedule:
    - cron: "17 11 * * 1"   # lunes 11:17 UTC (08:17 en Asunción)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONGRESOPY_CONTACTO: ${{ secrets.CONGRESOPY_CONTACTO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pipeline/bancadas.py foto
      - run: python pipeline/bancadas.py historial
      - run: python pipeline/bancadas.py sincronizar
      - run: python pipeline/analisis.py
      - run: python pipeline/exportar_sitio.py
      - run: python -m pytest -q
      - name: Commit si hubo cambios
        run: |
          git config user.name "congresopy-bot"
          git config user.email "congresopy-bot@users.noreply.github.com"
          git add silver site/datos salidas
          git diff --cached --quiet || git commit -m "Foto semanal de la nómina de SILpy ($(date -u +%F))"
          git push
