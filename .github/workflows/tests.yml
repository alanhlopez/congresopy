# Corre la suite de pytest en cada push y pull request.
# bronze/ (HTML crudo de SILpy) no está en git: los tests de reparseo se saltean y el resto corre completo.
# No hace requests a SILpy (no hay CONGRESOPY_CONTACTO): ningún test lo necesita.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -rs
